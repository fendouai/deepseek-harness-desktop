[package]
name = "dsh-desktop"
version = "0.1.0-rc.5"
description = "DeepSeek Harness desktop host"
authors = ["DeepSeek Harness contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.5"
url = "2.5.7"
